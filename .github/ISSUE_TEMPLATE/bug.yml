name: Bug
description: Something doesn't work as it should.
title: "[bug] "
labels: [bug]
body:
  - type: dropdown
    id: device
    attributes:
      label: Console
      options:
        - PSP-1000
        - PSP-2000
        - PSP-3000
        - PSP Go
        - PSP Street (E1000)
        - PS Vita 1000
        - PS Vita 2000
        - PS TV
        - PPSSPP (emulator)
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware
      description: The system software version and the custom firmware or HENkaku setup (for example "6.61 ARK-4" or "3.65 Ensō").
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PSPoken version
      description: Shown in Settings > About PSPoken.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Steps to make it happen again help most.
    validations:
      required: true
  - type: textarea
    id: book
    attributes:
      label: The book, if it's about one
      description: Its format if you know it (AAC-LC or HE-AAC, the bitrate) and how it was made. Please don't attach the audiobook itself.
  - type: textarea
    id: log
    attributes:
      label: PSPoken's log
      description: "pspoken_log.txt: in PSP/GAME/PSPoken/ on the PSP, in ux0:data/PSPoken/ on the PS Vita. It lists your books' file names, so look it over first. Drop the file here or paste the end of it."
